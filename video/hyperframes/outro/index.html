<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      Greenlight closing card. Built on two HyperFrames registry recipes:
      - logo-outro (block): logo pieces slide in from the right with a ripple stagger, overshoot and settle,
        then tagline and URL pill rise in.
      - blur-in (component): words resolve out of blur with a short stagger.
      Restyled for the film: white ground, ink type (Inter), the Greenlight mark in place of the sample logo.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; background: #fff; font-family: "Inter", sans-serif; color: #0b0c0e; overflow: hidden; }
      .lockup { position: absolute; left: 0; top: 300px; width: 1920px; height: 200px; }
      .mark { position: absolute; left: 860px; top: 0; width: 200px; height: 200px; }
      .mark svg { width: 200px; height: 200px; overflow: visible; }
      .piece { transform-box: fill-box; transform-origin: center; opacity: 0; }
      .shadow { position: absolute; left: 810px; top: 190px; width: 300px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(10, 12, 16, 0.16), rgba(10, 12, 16, 0)); opacity: 0; }
      .word { position: absolute; left: 1090px; top: 38px; font-size: 132px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; display: flex; }
      .word span, .tag span { display: inline-block; opacity: 0; }
      .tag { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
      .tag span { margin: 0 0.12em; }
      .t1 { top: 590px; font-size: 64px; color: #0b0c0e; }
      .t2 { top: 670px; font-size: 64px; color: #8a8f98; }
      .pills { position: absolute; top: 810px; left: 0; width: 1920px; display: flex; justify-content: center; gap: 18px; }
      .pill { opacity: 0; padding: 16px 30px; border-radius: 100px; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
      .pill.dark { background: #0b0c0e; color: #fff; }
      .pill.light { background: #fff; color: #0b0c0e; border: 1.5px solid #e3e5e8; }
      .built { position: absolute; top: 920px; width: 1920px; text-align: center; font-size: 22px; font-weight: 500; color: #8a8f98; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <div class="lockup">
        <div class="shadow"></div>
        <div class="mark">
          <svg viewBox="0 0 24 24">
            <rect class="piece p0" width="24" height="24" rx="5.6" fill="#0b0c0e" />
            <circle class="piece p1" cx="4.1" cy="13.9" r="1.45" fill="#fff" />
            <circle class="piece p2" cx="7.9" cy="17.6" r="1.52" fill="#fff" />
            <circle class="piece p3" cx="11.6" cy="13.9" r="1.58" fill="#fff" />
            <circle class="piece p4" cx="15.4" cy="10.1" r="1.64" fill="#fff" />
            <circle class="piece p5" cx="19.1" cy="6.4" r="2" fill="#22b36b" />
            <circle class="piece p6" cx="18.5" cy="5.8" r="0.55" fill="#ffffff" fill-opacity="0.75" />
          </svg>
        </div>
        <div class="word"></div>
      </div>
      <div class="tag t1"></div>
      <div class="tag t2"></div>
      <div class="pills">
        <div class="pill dark">greenlight-api-xi.vercel.app</div>
        <div class="pill light">github.com/XDGram/GREENLIGHT</div>
      </div>
      <div class="built">Built with Kane CLI and Claude Code</div>
    </div>
    <script>
      const words = (sel, text, chars) => {
        const el = document.querySelector(sel);
        (chars ? text.split("") : text.split(" ")).forEach((w) => {
          const s = document.createElement("span");
          s.textContent = w;
          el.appendChild(s);
        });
        return sel + " span";
      };
      const word = words(".word", "Greenlight", true);
      const t1 = words(".t1", "Kane CLI checks every promise.");
      const t2 = words(".t2", "Claude Code keeps them.");

      const tl = gsap.timeline({ paused: true });
      // logo-outro: pieces slide in from the right with a ripple stagger.
      [".p0", ".p1", ".p2", ".p3", ".p4", ".p5", ".p6"].forEach((p, i) => {
        tl.fromTo(p, { x: 140, opacity: 0, filter: "blur(6px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "power4.out" }, 0.05 + i * 0.07);
      });
      // Expand and close.
      tl.to(".mark", { scale: 1.12, duration: 0.45, ease: "back.out(1.7)" }, 1.05);
      tl.to(".mark", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 1.4);
      tl.fromTo(".shadow", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: "power2.out" }, 1.05);
      // The mark steps left and the wordmark resolves letter by letter (blur-in).
      tl.to(".mark", { x: -330, duration: 0.9, ease: "power3.inOut" }, 1.5);
      tl.to(".shadow", { x: -330, duration: 0.9, ease: "power3.inOut" }, 1.5);
      tl.set(".word", { x: -300 }, 0);
      tl.fromTo(word, { opacity: 0, y: 10, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, stagger: 0.035, ease: "power3.out" }, 1.75);
      // Tagline, on the voiceover's words (blur-in).
      tl.fromTo(t1, { opacity: 0, y: 14, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, stagger: 0.07, ease: "power3.out" }, 3.3);
      tl.fromTo(t2, { opacity: 0, y: 14, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, stagger: 0.07, ease: "power3.out" }, 5.85);
      // URL pills and credit rise in (logo-outro).
      tl.fromTo(".pill", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.12, ease: "power3.out" }, 7.55);
      tl.fromTo(".built", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 8.5);
      // A slow push in while it holds.
      tl.fromTo("#root", { scale: 1 }, { scale: 1.035, duration: 18, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
