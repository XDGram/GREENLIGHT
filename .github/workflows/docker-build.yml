# Build the Greenlight server image for linux/amd64 and linux/arm64 on every push to the
# working branch. Nothing is pushed or published to any registry, no secret is used, and
# Kane is only asked for its version (no test run, no credits).
name: docker-build

on:
  push:
    branches: [claude/elegant-dirac-tqdzmd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the linux/amd64 image for smoke checks (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: greenlight-server:ci
          provenance: false
          cache-from: type=gha

      - name: Smoke checks (no secrets, no Kane run)
        run: |
          set -euo pipefail
          test "$(docker run --rm greenlight-server:ci kane-cli --version)" = "0.10.6"
          docker run --rm greenlight-server:ci chromium --version
          test "$(docker run --rm greenlight-server:ci id -un)" = "greenlight"
          # The image carries no secret: without Supabase settings the server must refuse to start (exit 2).
          set +e
          docker run --rm greenlight-server:ci > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" = "2"
          grep -q "set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY" out.txt
          ! docker image inspect greenlight-server:ci --format '{{json .Config.Env}}' | grep -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_'
