# Controlled end-to-end test (Step 11): one working claim, one deliberately broken claim.
version: 1

project:
  name: Greenlight Test App
  description: Throwaway app with a working cart and a deliberately broken newsletter.
  url: https://gl-test-93mjujacr-timeb7208-5361s-projects.vercel.app/

claims:
  - id: CLM-001
    text: Users can add items to the cart.
  - id: CLM-002
    text: Users can subscribe to the newsletter.

tests:
  - id: cart-add-two
    title: Add two items to the cart
    claims: [CLM-001]
    steps:
      - name: Open the app
        do: Open the start page.
      - name: Add two items
        do: Click the "Add item" button two times.
      - name: Check the cart count
        expect_text: "Items in cart: 2"

  - id: newsletter-subscribe
    title: Subscribe to the newsletter
    claims: [CLM-002]
    steps:
      - name: Open the app
        do: Open the start page.
      - name: Subscribe
        do: Type "smoke@example.com" into the Email field and click the "Subscribe" button.
      - name: Check the confirmation
        expect_text: "Thanks for subscribing, smoke@example.com!"
